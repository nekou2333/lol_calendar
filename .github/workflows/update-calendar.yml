name: Update Calendar

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lol-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Swift
        run: docker run --rm swift:6.3.2-jammy swift --version

      - name: Test
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            swift:6.3.2-jammy \
            swift test

      - name: Generate calendar files
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          docker run --rm \
            --env CITO_API_KEY \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            swift:6.3.2-jammy \
            swift run LoLCalendar

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          git commit -m "Update calendar files"
          git push
