name: Update Calendar

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lol-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: swift:6.3.2-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Verify Swift
        run: swift --version

      - name: Test
        run: swift test

      - name: Generate calendar files
        run: swift run LoLCalendar
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          git commit -m "Update calendar files"
          git push
